<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesperine · Romantasy AI Chat</title>
<style>
  :root{
    --bg:#0d0b14; --panel:#161324; --panel2:#1e1a30; --line:#2b2542;
    --ink:#e8e3f5; --dim:#9a92b8; --gold:#d8b46a; --rose:#c96a8a; --ok:#6ac9a0;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,"SF Pro Text","PingFang SC",sans-serif;
       background:var(--bg);color:var(--ink);height:100vh;height:100dvh;overflow:hidden}
  .app{display:grid;grid-template-columns:260px 1fr;height:100vh;height:100dvh}

  /* ---- 侧栏 ---- */
  aside{background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;overflow:hidden}
  .brand{padding:16px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:16px;letter-spacing:.5px}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--dim)}
  .wallet{padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;
          display:flex;justify-content:space-between;align-items:center}
  .wallet b{color:var(--gold);font-size:15px}
  .tab{display:flex;border-bottom:1px solid var(--line)}
  .tab button{flex:1;padding:9px;background:none;border:0;color:var(--dim);
              cursor:pointer;font-size:12px}
  .tab button.on{color:var(--ink);border-bottom:2px solid var(--rose)}
  .list{overflow-y:auto;flex:1}
  .item{padding:11px 16px;border-bottom:1px solid rgba(43,37,66,.5);cursor:pointer;
        display:flex;gap:10px;align-items:flex-start}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--panel2);border-left:2px solid var(--rose)}
  .item img.face{width:44px;height:58px;object-fit:cover;object-position:top;
        border-radius:6px;border:1px solid var(--line);flex:0 0 auto;background:var(--panel2)}
  .item .n{font-weight:600;font-size:13px}
  .item .d{font-size:11px;color:var(--dim);margin-top:2px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
  .tags span{font-size:10px;padding:1px 6px;border-radius:8px;
             background:rgba(201,106,138,.16);color:var(--rose)}

  /* ---- 主区 ---- */
  main{display:flex;flex-direction:column;overflow:hidden}
  .top{padding:12px 18px;border-bottom:1px solid var(--line);
       display:flex;justify-content:space-between;align-items:center;gap:12px}
  .top .who{font-weight:600}
  .top .sub{font-size:11px;color:var(--dim)}

  /* ---- 立绘动效（纯 CSS，无需额外资材）---- */
  #heroFace{position:absolute;right:0;top:0;height:100%;width:auto;max-height:130px;
        object-fit:cover;object-position:top;opacity:.6;
        -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);
        mask-image:linear-gradient(90deg,transparent,#000 45%);pointer-events:none;
        will-change:transform,opacity;
        /* 呼吸：极缓慢的缩放，模拟角色“活着” */
        animation:breathe 6s ease-in-out infinite;}
  @keyframes breathe{
    0%,100%{transform:scale(1) translateY(0)}
    50%    {transform:scale(1.022) translateY(-2px)}
  }
  /* 光晕扫过：像烛光拂过脸面 */
  .top::after{content:'';position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(105deg,transparent 35%,rgba(216,180,106,.10) 50%,transparent 65%);
        background-size:250% 100%;animation:sheen 9s ease-in-out infinite}
  @keyframes sheen{
    0%,100%{background-position:150% 0}
    50%    {background-position:-50% 0}
  }
  .top{position:relative;overflow:hidden}

  /* 列表缩略图：hover 微动 + 呼吸错峰（避免整列同时动，看着假）*/
  .item img.face{transition:transform .35s ease, box-shadow .35s ease;
        animation:breathe 7s ease-in-out infinite}
  .item:hover img.face{transform:scale(1.06) translateY(-1px);
        box-shadow:0 4px 18px rgba(201,106,138,.35)}
  .item:nth-child(2n) img.face{animation-delay:-2.3s}
  .item:nth-child(3n) img.face{animation-delay:-4.1s}
  .item:nth-child(5n) img.face{animation-delay:-1.2s}

  /* 无障碍：尊重系统的“减少动态效果”设置 */
  @media (prefers-reduced-motion: reduce){
    #heroFace,.item img.face,.top::after{animation:none !important}
  }
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
         border-radius:6px;padding:5px 8px;font-size:12px}
  .chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .empty{margin:auto;text-align:center;color:var(--dim);font-size:13px}

  .msg{max-width:78%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;
       word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--panel2);border:1px solid var(--line)}
  .msg.ai{align-self:flex-start;background:linear-gradient(180deg,#1c1730,#171327);
          border:1px solid #2e2748}
  .msg .status{display:block;margin-top:7px;font-size:10.5px;color:var(--dim);
               font-style:normal}

  /* ---- 语音播放 ---- */
  .msg .say{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
        font-size:11px;color:var(--dim);cursor:pointer;user-select:none;
        border:1px solid var(--line);border-radius:12px;padding:3px 10px;
        background:rgba(255,255,255,.02);transition:.2s}
  .msg .say:hover{color:var(--rose);border-color:var(--rose)}
  .msg .say.playing{color:var(--rose);border-color:var(--rose)}
  .msg .say.loading{color:var(--gold);border-color:var(--gold);cursor:wait}
  .msg .say .dot{width:6px;height:6px;border-radius:50%;background:currentColor;
        animation:pulse 1s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .msg .say .dot{animation:none} }
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  .composer{border-top:1px solid var(--line);padding:12px 18px;background:var(--panel)}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;height:56px;background:var(--panel2);color:var(--ink);
           border:1px solid var(--line);border-radius:10px;padding:9px 11px;
           font:inherit;outline:none}
  textarea:focus{border-color:var(--rose)}
  button.act{background:var(--rose);border:0;color:#fff;border-radius:10px;
             padding:0 18px;height:56px;cursor:pointer;font-size:13px;font-weight:600}
  button.act:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
               border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px}
  .hint{font-size:11px;color:var(--dim);margin-top:7px;display:flex;
        justify-content:space-between;align-items:center;gap:10px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:#2a2340;border:1px solid var(--line);padding:9px 16px;
         border-radius:20px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
  .spinner{width:11px;height:11px;border:2px solid var(--dim);border-top-color:var(--rose);
           border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 广场（动态流） ---- */
  .card{background:linear-gradient(180deg,#1a1630,#161327);border:1px solid #2b2542;
        border-radius:12px;padding:14px 16px;max-width:620px;width:100%}
  .card .meta{font-size:11px;color:var(--dim);margin-bottom:7px;display:flex;
              gap:8px;align-items:center}
  .card .body{white-space:pre-wrap;line-height:1.6}
  .card .acts{margin-top:11px;display:flex;gap:14px;font-size:12px;color:var(--dim)}
  .card .acts span{cursor:pointer}
  .card .acts span:hover{color:var(--rose)}
  .card .acts span.on{color:var(--rose);font-weight:600}
  .card .cmt{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
             font-size:12px;color:var(--dim);white-space:pre-wrap}

  /* ---- 章节 ---- */
  .ch{background:linear-gradient(180deg,#1a1630,#161327);border:1px solid #2b2542;
      border-radius:12px;padding:13px 15px;max-width:620px;width:100%}
  .ch.locked{opacity:.62}
  .ch .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ch .t{font-weight:600;font-size:13.5px}
  .ch .th{font-size:11px;color:var(--dim);white-space:nowrap}
  .ch .intro{font-size:12px;color:var(--dim);margin-top:5px;font-style:italic}
  .ch .body{margin-top:10px;font-size:13px;white-space:pre-wrap;line-height:1.65;
            padding-top:9px;border-top:1px solid var(--line)}
  .pill{font-size:10px;padding:1px 7px;border-radius:9px;margin-left:6px}
  .pill.pos{background:rgba(106,201,160,.18);color:var(--ok)}
  .pill.neg{background:rgba(201,106,138,.18);color:var(--rose)}
  .affbar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;
          max-width:620px;width:100%;margin-top:4px}
  .affbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold))}

  /* ---- 角色创建表单 ---- */
  .form{max-width:620px;width:100%;background:linear-gradient(180deg,#1a1630,#161327);
        border:1px solid #2b2542;border-radius:12px;padding:16px 18px}
  .form h3{margin:0 0 4px;font-size:15px}
  .form .note{font-size:11px;color:var(--dim);margin-bottom:14px}
  .form label{display:block;font-size:11px;color:var(--gold);margin:11px 0 4px;
        letter-spacing:.04em}
  .form input,.form textarea{width:100%;background:var(--panel2);color:var(--ink);
        border:1px solid var(--line);border-radius:8px;padding:8px 10px;
        font:inherit;font-size:12.5px;outline:none}
  .form input:focus,.form textarea:focus{border-color:var(--rose)}
  .form textarea{resize:vertical}
  .form .counter{float:right;font-size:10px;color:var(--dim);font-weight:400}
  .form .counter.over{color:var(--rose)}
  .form .actions{margin-top:16px;display:flex;gap:8px}
  .detail{max-width:680px;width:100%;display:flex;gap:18px;align-items:flex-start}
  .detail .portrait{width:210px;flex:0 0 auto;border-radius:12px;
        border:1px solid var(--line);display:block}
  .detail .info{flex:1;min-width:0}
  .detail h2{margin:0 0 4px;font-size:19px}
  .detail .desc{font-size:12.5px;color:var(--dim);margin-bottom:12px}
  .detail .sec{margin-top:12px}
  .detail .sec h4{margin:0 0 5px;font-size:11px;letter-spacing:.06em;
        text-transform:uppercase;color:var(--gold)}
  .detail .sec p{margin:0;font-size:12.5px;line-height:1.65;color:#cdc6e0}
  .detail .firstmsg{font-size:12.5px;line-height:1.65;color:#cdc6e0;
        background:var(--panel2);border-left:2px solid var(--rose);
        padding:10px 12px;border-radius:0 8px 8px 0;white-space:pre-wrap}
  .detail .statusbar{font-size:11.5px;color:var(--gold);margin-top:10px;
        background:rgba(216,180,106,.08);padding:7px 11px;border-radius:7px}
  @media (max-width:640px){
    .detail{flex-direction:column} .detail .portrait{width:170px;margin:0 auto}
  }

  /* ---- 移动端适配（手机浏览器 / WebView）----
     桌面为「260px 侧栏 + 主区」双栏；窄屏收成单栏，
     侧栏移入抽屉，由左上角 ☰ 唤出，避免两栏硬挤成一屏两页。 */
  .menu{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:69;
         opacity:0;pointer-events:none;transition:opacity .26s}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    aside{position:fixed;top:0;bottom:0;left:0;width:286px;max-width:86vw;z-index:70;
          transform:translateX(-100%);
          transition:transform .26s cubic-bezier(.4,0,.2,1);
          box-shadow:0 0 44px rgba(0,0,0,.66)}
    body.nav-open aside{transform:translateX(0)}
    body.nav-open .scrim{opacity:1;pointer-events:auto}
    .menu{display:inline-flex;align-items:center;justify-content:center;
          width:38px;height:38px;flex:0 0 auto;padding:0;font-size:17px;line-height:1;
          background:var(--panel2);border:1px solid var(--line);border-radius:10px;
          color:var(--ink);cursor:pointer;position:relative;z-index:1}
    .top{padding:10px 12px;flex-wrap:wrap;gap:8px}
    #chatTools{flex-wrap:wrap;gap:6px;justify-content:flex-end}
    #chatTools .ghost{padding:5px 9px;font-size:11.5px}
    #chatTools select{font-size:11.5px;padding:5px 7px}
    #heroFace{max-height:96px;opacity:.42}
    .chat{padding:13px}
    .msg{max-width:88%}
    .list .item{padding:12px 14px}
    .composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
    /* toast 上移，避免盖住 composer 的消耗/额度提示 */
    .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
    .form,.gen,.card,.ch,.grid,.detail,.affbar{max-width:none}
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
        gap:10px;max-width:760px;width:100%}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
            border:1px solid var(--line);display:block;transition:transform .3s ease}
  .grid .cell:hover img{transform:scale(1.04)}
  .grid .cell{position:relative;overflow:hidden;border-radius:10px}
  .grid .cell .tag{position:absolute;left:6px;bottom:6px;font-size:10px;
        background:rgba(0,0,0,.6);padding:1px 6px;border-radius:8px;color:var(--dim)}
  .gen{background:linear-gradient(180deg,#1a1630,#161327);border:1px solid #2b2542;
       border-radius:12px;padding:13px 15px;max-width:620px;width:100%}
  .gen textarea{width:100%;height:52px;background:var(--panel2);color:var(--ink);
      border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:12.5px}
  .gen .row2{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .busy{display:inline-block;width:12px;height:12px;border:2px solid var(--dim);
        border-top-color:var(--rose);border-radius:50%;animation:spin .8s linear infinite}
  /* ---- 窄屏主区列表 ---- */
  .mainlist{overflow-y:auto;flex:1;padding:10px 12px 18px}
  .mainlist .item{background:var(--panel);border:1px solid var(--line);
        border-radius:12px;margin-bottom:8px}
  .mainlist .item:last-child{margin-bottom:0}
  .mainlist .empty{padding:40px 0;text-align:center;color:var(--dim);font-size:13px}

  /* ---- 账号区 ---- */
  .userbox{margin-top:auto;padding:12px 14px 14px;border-top:1px solid var(--line);
        display:flex;flex-direction:column;gap:7px}
  .ub-who{font-size:12px;color:var(--dim);margin-bottom:2px;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}
  .ub-who span{color:var(--ink)}
  .ub-btn{height:32px;border-radius:8px;background:var(--panel2);
        border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12.5px;
        cursor:pointer}
  .ub-btn:hover{color:var(--ink);border-color:#3d3558}
  .ub-danger{color:var(--rose);border-color:rgba(201,106,138,.3)}
  .ub-danger.armed{background:rgba(201,106,138,.16);color:#f0a4bd;
        border-color:var(--rose)}
  .ub-note{font-size:10.5px;color:#6f6885;line-height:1.5}
  .pwform{display:flex;flex-direction:column;gap:6px;margin:2px 0 4px}
  .pwform .authinput{height:34px;font-size:12.5px;padding:0 10px}
  .pwrow{display:flex;gap:6px}
  .pwrow .ub-btn{flex:1}

  /* ---- 登录界面 ---- */
  .authgate{position:fixed;inset:0;z-index:200;display:flex;
        align-items:center;justify-content:center;padding:22px;
        background:radial-gradient(120% 70% at 50% 0%,#2c2350 0%,#14102a 40%,#0d0b14 70%)}
  .authcard{width:100%;max-width:380px;background:var(--panel);
        border:1px solid var(--line);border-radius:16px;padding:26px 24px 22px;
        box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .authbrand{text-align:center;margin-bottom:20px}
  .authbrand h1{margin:0;font-size:26px;letter-spacing:.04em;
        background:linear-gradient(180deg,#fff 12%,#e6c98d 78%,#d8b46a 100%);
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;color:#e6c98d}
  .authbrand p{margin:5px 0 0;font-size:12.5px;color:var(--dim)}
  .authmsg{min-height:18px;margin-bottom:12px;font-size:12.5px;
        color:var(--rose);text-align:center;line-height:1.5}
  .authmsg.ok{color:var(--ok)}
  .authlabel{display:block;font-size:11.5px;color:var(--dim);
        margin:12px 0 6px;letter-spacing:.03em}
  .authinput{width:100%;height:42px;background:var(--panel2);color:var(--ink);
        border:1px solid var(--line);border-radius:9px;padding:0 12px;
        font:inherit;font-size:14px}
  .authinput:focus{outline:none;border-color:var(--rose)}
  .authbtn{width:100%;height:44px;margin-top:20px;border:none;border-radius:10px;
        background:linear-gradient(180deg,#d4799a,#c96a8a);color:#fff;
        font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .authbtn:disabled{opacity:.55;cursor:default}
  .authlink{display:block;width:100%;margin-top:14px;background:none;border:none;
        color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer;
        text-decoration:underline;text-underline-offset:3px}
  .authlink:hover{color:var(--ink)}
</style>
</head>
<body>

<!-- 登录 / 注册。未持有有效令牌时遮住整个界面 ——
     服务端除 /api/auth/* 外都要求登录，否则未登录设备会全部落到
     同一个匿名用户上，多用户隔离就形同虚设。 -->
<div id="authGate" class="authgate" style="display:none">
  <div class="authcard">
    <div class="authbrand">
      <h1>Vesperine</h1>
      <p>Romantasy AI Chat</p>
    </div>
    <div id="authMsg" class="authmsg"></div>
    <label class="authlabel" for="authEmail">Email</label>
    <input id="authEmail" class="authinput" type="email" autocomplete="email"
           placeholder="you@example.com">
    <label class="authlabel" for="authPass">Password</label>
    <input id="authPass" class="authinput" type="password"
           autocomplete="current-password" placeholder="At least 8 characters">
    <button id="authSubmit" class="authbtn">Sign in</button>
    <button id="authSwitch" class="authlink">Create a new account</button>
  </div>
</div>

<div class="app">
  <aside>
    <div class="brand">
      <h1>Vesperine</h1>
      <p>Romantasy AI Chat · 1:1 复刻</p>
      <p id="apiHint" style="margin-top:4px;font-size:10px;color:var(--dim)"></p>
    </div>
    <div class="wallet">
      <span>💖 Hearts</span><b id="hearts">–</b>
    </div>
    <div class="tab">
      <button id="tabRoles" class="on">角色</button>
      <button id="tabRooms">会话</button>
      <button id="tabFeed">动态</button>
      <button id="tabScen">情景</button>
      <button id="tabAlbum">相册</button>
    </div>
    <div class="list" id="list"></div>

    <!-- 账号区。放在侧栏底部，窄屏下随抽屉一起出现。 -->
    <div class="userbox">
      <div class="ub-who">
        <span id="userName">—</span>
      </div>
      <button class="ub-btn" id="btnChangePw">Change password</button>
      <div id="pwForm" class="pwform" style="display:none">
        <input id="pwCurrent" class="authinput" type="password"
               autocomplete="current-password" placeholder="Current password">
        <input id="pwNew" class="authinput" type="password"
               autocomplete="new-password" placeholder="New password (8+ chars)">
        <div class="pwrow">
          <button class="ub-btn" id="pwSubmit">Update</button>
          <button class="ub-btn" id="pwCancel">Cancel</button>
        </div>
      </div>
      <button class="ub-btn" id="btnSignOut">Sign out</button>
      <button class="ub-btn ub-danger" id="btnDeleteAccount">Delete account</button>
      <div class="ub-note">Deleting erases your conversations, memories and hearts.</div>
    </div>
  </aside>

  <main>
    <div class="top">
      <button class="menu" id="btnMenu" aria-label="打开列表">☰</button>
      <img id="heroFace" style="display:none" alt="">
      <div style="position:relative;z-index:1">
        <div class="who" id="who">选择一个角色开始</div>
        <div class="sub" id="sub"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;position:relative;z-index:1" id="chatTools">
        <span id="affBadge" title="好感度"
              style="font-size:11px;color:var(--gold);white-space:nowrap"></span>
        <select id="modeSel" title="聊天模式（对应 /chatMode 档位）"></select>
        <button class="ghost" id="btnChapters" title="隐藏章节">📖 章节</button>
        <button class="ghost" id="btnAd" title="看广告换 hearts">📺 广告</button>
        <button class="ghost" id="btnMem" title="生成记忆摘要">🧠 记忆</button>
      </div>
    </div>

    <!-- 聊天视图 -->
    <div class="chat" id="chat">
      <div class="empty">从左侧选一个角色，点击「开始对话」</div>
    </div>

    <!-- 广场视图（动态流） -->
    <div class="chat" id="feed" style="display:none"></div>

    <div class="composer" id="composer">
      <div class="row">
        <textarea id="input" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="act" id="send">发送</button>
      </div>
      <div class="hint">
        <span id="cost">本次消耗：– 💖</span>
        <span id="adInfo"></span>
      </div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);

/* API 地址解析 —— 三种方式，按优先级：
 *   1. URL 参数：  http://host/page?api=http://192.168.1.10:8080
 *   2. 全局注入：  window.__VESPERINE_API__ = 'http://192.168.1.10:8080'
 *   3. 同源（默认，前后端同机时用）
 * 打包成 App / WebView 嵌入时用前两种。
 */
const API_BASE = (() => {
  try {
    const q = new URLSearchParams(location.search).get('api');
    if (q) return q.replace(/\/$/, '');
  } catch (e) {}
  if (window.__VESPERINE_API__) return String(window.__VESPERINE_API__).replace(/\/$/, '');
  return '';                       // 同源
})();

/* 访问密钥 —— 服务端对 /api/* 做校验。来源与 API_BASE 同理，
 * 优先 URL 参数 ?key=，其次 window.__VESPERINE_KEY__。
 * 未配置则不发此头（服务端也不会校验，用于本地开发）。 */
const ACCESS_KEY = (() => {
  try {
    const q = new URLSearchParams(location.search).get('key');
    if (q) return q;
  } catch (e) {}
  return window.__VESPERINE_KEY__ ? String(window.__VESPERINE_KEY__) : '';
})();

/* 访问令牌 —— 存 localStorage，比内存变量耐页面刷新；
 * APK 侧已开启 DOM storage，重启应用也还在。 */
const TOKEN_KEY = 'vesperine_token';
const AUTH_TOKEN = {
  get() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } },
  set(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
};

/* 立绘地址。
 *
 * App 内嵌了立绘（assets/www/generated），走 file:// 相对路径读取 ——
 * 实测跨国下载 350 KB 要 8~50 秒，而本地读取是即时。
 * 浏览器里没有内嵌资源，仍回落到服务端。 */
function portraitUrl(name) {
  const file = `portrait-${String(name).toLowerCase()}.jpeg`;
  return (location.protocol === 'file:')
    ? `generated/${file}`
    : `${API_BASE}/generated/${file}`;
}

/** 统一构造请求头：附加 app 访问密钥与用户令牌。 */
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (ACCESS_KEY) h['X-Access-Key'] = ACCESS_KEY;
  const t = AUTH_TOKEN.get();
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}

let state = { roles: [], rooms: [], modes: [], chatroom: null, role: null,
              tab: 'roles', sending: false };

async function api(path, opts) {
  const o = Object.assign({}, opts);
  o.headers = authHeaders(o.headers);
  const r = await fetch(API_BASE + path, o);
  const data = await r.json();
  // 令牌失效：清掉并退回登录界面。认证端点本身除外 ——
  // 登录失败返回的也是 401 语义，不能因此递归弹窗。
  if (r.status === 401 && data && data.msg === 'UNAUTHORIZED'
      && !path.startsWith('/api/auth/')) {
    AUTH_TOKEN.clear();
    showAuthGate(authErrorText('UNAUTHORIZED'));
  }
  return data;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200);
}
function currentMode() {
  return state.modes.find(m => m.id === $('#modeSel').value);
}

/* ---------- 侧栏渲染 ---------- */
/* ---------- 角色创建（Creator Studio 侧）---------- */
function openRoleForm() {
  const box = $('#chat');
  box.innerHTML = '';
  const f = document.createElement('div');
  f.className = 'form';
  f.innerHTML = `<h3>创建角色</h3>
    <div class="note">字段限制对齐官方：名称 30 字 · 背景 3000 字 · 开场白 1000 字 · 标签 20 个</div>

    <label>名字 <span class="counter" id="cName">0/30</span></label>
    <input id="fName" maxlength="30" placeholder="如 Vivienne">

    <label>一句话描述</label>
    <input id="fDesc" placeholder="如 A ghost bound to a stopped clock.">

    <label>性格（用逗号分隔的标签）</label>
    <input id="fPers" placeholder="如 Spectral, tender, trapped in time">

    <label>背景故事 <span class="counter" id="cBg">0/3000</span></label>
    <textarea id="fBg" rows="4" maxlength="3000"
      placeholder="TA 的过去、执念、秘密…"></textarea>

    <label>开场白 <span class="counter" id="cFm">0/1000</span></label>
    <textarea id="fFm" rows="3" maxlength="1000"
      placeholder="*动作描写* 第一句话"></textarea>

    <label>状态栏（可选，每句话末尾显示）</label>
    <input id="fSb" placeholder="如 📍 Moonlit Hall | 💖 Affection: 5%">

    <label>标签 <span class="counter" id="cTags">0/20</span></label>
    <input id="fTags" placeholder="如 ghost, tragic, romantasy（逗号分隔）">

    <div class="actions">
      <button class="act" style="height:36px" id="fSubmit">创建</button>
      <button class="ghost" id="fCancel">取消</button>
    </div>`;
  box.appendChild(f);

  const bind = (id, counterId, limit) => {
    const el = f.querySelector('#' + id), c = f.querySelector('#' + counterId);
    const upd = () => {
      const n = el.value.length;
      c.textContent = `${n}/${limit}`;
      c.classList.toggle('over', n > limit);
    };
    el.addEventListener('input', upd); upd();
  };
  bind('fName', 'cName', 30);
  bind('fBg', 'cBg', 3000);
  bind('fFm', 'cFm', 1000);

  f.querySelector('#fCancel').onclick = () => switchTab('roles');
  f.querySelector('#fSubmit').onclick = async () => {
    const name = f.querySelector('#fName').value.trim();
    if (!name) return toast('名字必填');
    const tagsRaw = f.querySelector('#fTags').value.trim();
    const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
    if (tags.length > 20) return toast('标签最多 20 个');

    const r = await api('/api/role/create', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name,
        description: f.querySelector('#fDesc').value.trim(),
        personality: f.querySelector('#fPers').value.trim(),
        background:  f.querySelector('#fBg').value,
        firstMessage: f.querySelector('#fFm').value,
        statusBar:   f.querySelector('#fSb').value.trim(),
        tags,
      })
    });
    if (r.flag !== 0) return toast('创建失败：' + r.msg);
    toast(`已创建《${r.data.name}》`);
    await refreshRoles();
    switchTab('roles');
  };
}

async function refreshRoles() {
  const r = await api('/api/role/list');
  if (r.flag === 0) state.roles = r.data || [];
}

async function renderRoleDetail(role) {
  exitOverlay();           // 窄屏：从列表切回聊天视图
  const box = $('#chat');
  box.innerHTML = '';
  const d = await api('/api/role/' + role.id);
  const r = (d.flag === 0 && d.data) ? d.data : role;

  const wrap = document.createElement('div');
  wrap.className = 'detail';
  const face = portraitUrl(r.name);
  wrap.innerHTML = `
    <img class="portrait" src="${face}" alt="${r.name}"
         onerror="this.style.visibility='hidden'">
    <div class="info">
      <h2>${r.name}</h2>
      <div class="desc">${r.description || ''}</div>
      <div class="tags">${(r.tags||[]).map(t=>`<span>${t}</span>`).join('')}</div>
      ${r.personality ? `<div class="sec"><h4>Personality</h4><p>${r.personality}</p></div>` : ''}
      ${r.background ? `<div class="sec"><h4>Background</h4><p>${r.background}</p></div>` : ''}
      ${r.first_message ? `<div class="sec"><h4>Opening</h4>
        <div class="firstmsg">${r.first_message}</div></div>` : ''}
      ${r.status_bar ? `<div class="statusbar">${r.status_bar}</div>` : ''}
      <div class="sec" style="display:flex;gap:8px;margin-top:16px">
        <button class="act" style="height:36px" id="dStart">开始对话</button>
        <button class="ghost" id="dChapters">📖 查看章节</button>
      </div>
    </div>`;
  box.appendChild(wrap);

  $('#who').textContent = r.name;
  $('#sub').textContent = r.personality || '';
  setHero(r.name);

  wrap.querySelector('#dStart').onclick = () => startChat(r);
  wrap.querySelector('#dChapters').onclick = () => {
    state.role = r;
    state.tab = 'chapters';
    switchTab('chapters');
  };
}

/* 列表填充逻辑抽出来，侧栏（桌面/抽屉）与主区（窄屏）共用同一份。 */
function fillRolesInto(box) {
  const add = document.createElement('div');
  add.className = 'item';
  add.style.cssText = 'color:var(--rose);font-size:13px;padding:12px 16px';
  add.textContent = '+ 创建角色';
  add.onclick = () => { navOpen(false); openRoleForm(); };
  box.appendChild(add);

  state.roles.forEach(r => {
    const d = document.createElement('div');
    d.className = 'item';
    // 立绘：约定文件名 portrait-<name>.jpeg，缺失时自动隐藏
    const face = portraitUrl(r.name);
    d.innerHTML = `<img class="face" src="${face}" alt="${r.name}"
        loading="lazy" onerror="this.style.display='none'">
      <div style="min-width:0;flex:1">
        <div class="n">${r.name}</div>
        <div class="d">${r.description}</div>
        <div class="tags">${(r.tags||[]).slice(0,3).map(t=>`<span>${t}</span>`).join('')}</div>
      </div>`;
    d.onclick = () => { navOpen(false); renderRoleDetail(r); };
    box.appendChild(d);
  });
}

function fillRoomsInto(box) {
  if (!state.rooms.length) {
    box.innerHTML = '<div class="empty">还没有会话</div>';
    return;
  }
  state.rooms.forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (state.chatroom && state.chatroom.id === c.id ? ' on' : '');
    d.innerHTML = `<div class="n">${c.role_name}</div>
      <div class="d">${c.chat_mode} · ${new Date(c.updated_at*1000).toLocaleString()}</div>`;
    d.onclick = () => { navOpen(false); openRoom(c); };
    box.appendChild(d);
  });
}

function renderList() {
  const l = $('#list');
  l.innerHTML = '';
  if (state.tab === 'roles') fillRolesInto(l);
  else fillRoomsInto(l);
}

function isNarrow() {
  return window.matchMedia('(max-width:820px)').matches;
}

/* 窄屏下侧栏藏在抽屉里，角色列表直接放主区 ——
   否则新用户打开应用只看到空聊天区，得先想到点左上角的 ☰。 */
function renderMainList() {
  const feed = $('#feed');
  feed.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'mainlist';
  if (state.tab === 'roles') fillRolesInto(wrap);
  else fillRoomsInto(wrap);
  feed.appendChild(wrap);
}

/* 从 overlay（列表/动态/情景/相册）切回聊天视图。 */
function exitOverlay() {
  if (!isNarrow()) return;
  $('#feed').style.display = 'none';
  $('#chat').style.display = 'flex';
  $('#composer').style.display = 'block';
  $('#chatTools').style.display = 'flex';
}

/* ---------- 开始 / 打开会话 ---------- */
async function startChat(role) {
  const mode = $('#modeSel').value || 'classic';
  const res = await api('/api/chatroom', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ roleId: role.id, chatMode: mode })
  });
  if (res.flag !== 0) return toast('创建会话失败：' + res.msg);
  state.role = role;
  state.chatroom = { id: res.data.id, chat_mode: mode, role_id: role.id };
  $('#who').textContent = role.name;
  $('#sub').textContent = role.personality || '';
  setHero(role.name);
  await refreshRooms();
  await loadMessages();
  await refreshAffinity();
  state.tab = 'rooms'; switchTab('rooms');
}

function setHero(roleName) {
  const el = $('#heroFace');
  if (!roleName) { el.style.display = 'none'; return; }
  const url = portraitUrl(roleName);
  el.onerror = () => { el.style.display = 'none'; };
  el.onload = () => { el.style.display = 'block'; };
  el.src = url;
  // 给 src 赋同样的值不会重新触发 load 事件，缓存命中时 onload 永不执行，
  // display 就卡在初始的 none 上。这里补一次「已加载完成」检查。
  if (el.complete && el.naturalWidth > 0) el.style.display = 'block';
}

function openRoom(c) {
  exitOverlay();           // 窄屏：从列表切回聊天视图
  state.chatroom = c;
  state.role = state.roles.find(r => r.id === c.role_id);
  $('#who').textContent = c.role_name;
  $('#sub').textContent = state.role ? (state.role.personality||'') : '';
  setHero(c.role_name);
  $('#modeSel').value = c.chat_mode;
  updateCost();
  loadMessages();
  refreshAffinity();
  renderList();
}

async function loadMessages() {
  if (!state.chatroom) return;
  const res = await api('/api/message/list?chatroomId=' + state.chatroom.id);
  const box = $('#chat'); box.innerHTML = '';
  (res.data || []).forEach(m => {
    const el = appendMsg(m.speaker === 'user' ? 'user' : 'ai',
      m.content,
      m.heart_cost ? `−${m.heart_cost} 💖` : (m.is_ad_funded ? '📺 广告抵扣' : ''));
    el.dataset.id = m.id;
    const btn = el.querySelector('.say');
    if (btn) btn.onclick = (e) => { e.stopPropagation(); playSpeech(m.id, btn); };
  });
  box.scrollTop = box.scrollHeight;
}

function appendMsg(kind, text, status) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.textContent = text;
  if (status) {
    const s = document.createElement('em'); s.className = 'status'; s.textContent = status;
    d.appendChild(s);
  }
  // 角色消息加「朗读」按钮（动作描写会被自动剔除，不朗读）
  if (kind === 'ai' && text && text.trim()) {
    const btn = document.createElement('span');
    btn.className = 'say';
    btn.textContent = '🔊 朗读';
    if (d.dataset.id) btn.dataset.mid = d.dataset.id;
    d.appendChild(btn);
  }
  $('#chat').appendChild(d);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return d;
}

/* ---------- 发送（SSE 流式） ---------- */
async function send() {
  if (state.sending) return;
  const text = $('#input').value.trim();
  if (!text) return;
  if (!state.chatroom) return toast('请先选择一个角色');

  state.sending = true; $('#send').disabled = true;
  appendMsg('user', text);
  $('#input').value = '';

  const bubble = appendMsg('ai', '');
  bubble.innerHTML = '<span class="spinner"></span>';
  let acc = '';

  try {
    const resp = await fetch(API_BASE + '/api/message/send', {
      method: 'POST', headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ chatroomId: state.chatroom.id, text })
    });
    if (resp.headers.get('content-type')?.includes('application/json')) {
      const j = await resp.json();
      bubble.textContent = '';
      toast(j.msg === 'NOT_ENOUGH_HEARTS' ? 'Hearts 不足，点右上「📺 广告」补充' : ('发送失败：' + j.msg));
      state.sending = false; $('#send').disabled = false; return;
    }
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const evt = JSON.parse(line.slice(5).trim());
        if (evt.event === 'meta') {
          if (evt.heartInfo) $('#hearts').textContent = evt.heartInfo.amount;
          bubble.dataset.cost = evt.cost;
          if (evt.affinity) {
            const a = evt.affinity;
            $('#affBadge').textContent = `💗 ${a.value} ${a.label}`;
            if (a.delta) {
              const tag = document.createElement('em');
              tag.className = 'status';
              tag.textContent = `好感度 ${a.delta > 0 ? '+' : ''}${a.delta}（${a.reason}）`;
              bubble.appendChild(tag);
            }
          }
        } else if (evt.event === 'token') {
          acc += evt.text; bubble.textContent = acc;
          $('#chat').scrollTop = $('#chat').scrollHeight;
        } else if (evt.event === 'error') {
          toast('模型错误：' + evt.msg);
        }
      }
    }
  } catch (e) {
    toast('请求异常：' + e.message);
  }
  if (!acc) bubble.textContent = '（无输出）';
  state.sending = false; $('#send').disabled = false;
  // 流式刚生成的这条消息需要拿 messageId 才能朗读
  if (acc && state.chatroom) {
    const lr = await api('/api/message/list?chatroomId=' + state.chatroom.id);
    const last = (lr.data || []).filter(m => m.speaker === 'assistant').pop();
    if (last) {
      bubble.dataset.id = last.id;
      const btn = bubble.querySelector('.say');
      if (btn) btn.onclick = (e) => { e.stopPropagation(); playSpeech(last.id, btn); };
    }
  }
  refreshWallet(); refreshAd();
}

/* ---------- 举报（UGC 产品上架必需）----------
   用自建弹窗而非 window.prompt —— WebView 默认不渲染原生 prompt，
   在 App 里会静默失败。 */
async function openReport(targetType, targetId) {
  const r = await api('/api/report/reasons');
  const reasons = r.data || [];
  if (!reasons.length) return toast('举报服务暂不可用');

  const mask = document.createElement('div');
  mask.style.cssText =
    'position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:200;'
    + 'display:flex;align-items:center;justify-content:center;padding:24px';
  mask.innerHTML =
    '<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;'
    + 'padding:20px;width:100%;max-width:340px;max-height:76vh;overflow-y:auto">'
    + '<div style="font-size:15px;font-weight:600;margin-bottom:4px">举报</div>'
    + '<div style="font-size:12px;color:var(--dim);margin-bottom:14px">'
    + '请选择原因。恶意举报会被记录。</div>'
    + '<div id="rlist"></div>'
    + '<textarea id="rdetail" placeholder="补充说明（可留空）" '
    + 'style="width:100%;height:54px;margin-top:10px;background:var(--panel2);color:var(--ink);'
    + 'border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12.5px"></textarea>'
    + '<div style="display:flex;gap:8px;margin-top:14px">'
    + '<button class="ghost" id="rcancel" style="flex:1;padding:10px">取消</button>'
    + '<button class="act" id="rsubmit" style="flex:1;height:auto;padding:10px">提交</button>'
    + '</div>'
    + '<div id="rerr" style="font-size:11.5px;color:var(--rose);margin-top:9px"></div>'
    + '</div>';
  document.body.appendChild(mask);

  let picked = '';
  const listBox = mask.querySelector('#rlist');
  reasons.forEach(x => {
    const b = document.createElement('div');
    b.textContent = x.label + (x.urgent ? ' ⚠' : '');
    b.style.cssText =
      'padding:10px 12px;margin-bottom:6px;border-radius:8px;cursor:pointer;font-size:13px;'
      + 'background:var(--panel2);border:1px solid var(--line)';
    b.onclick = () => {
      picked = x.id;
      [...listBox.children].forEach(el => {
        el.style.borderColor = 'var(--line)';
        el.style.color = '';
      });
      b.style.borderColor = 'var(--rose)';
      b.style.color = 'var(--rose)';
    };
    listBox.appendChild(b);
  });

  const close = () => mask.remove();
  mask.querySelector('#rcancel').onclick = close;
  mask.onclick = e => { if (e.target === mask) close(); };
  mask.querySelector('#rsubmit').onclick = async () => {
    const errEl = mask.querySelector('#rerr');
    if (!picked) { errEl.textContent = '请先选择一个原因'; return; }
    const detail = mask.querySelector('#rdetail').value.trim();
    const rr = await api('/api/report/create', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ targetType, targetId, reason: picked, detail })
    });
    if (rr.flag !== 0) { errEl.textContent = rr.msg || '提交失败'; return; }
    close();
    toast(rr.data && rr.data.duplicate ? '你已经举报过了' : '举报已提交，我们会尽快处理');
  };
}

/* ---------- 广场（动态流）---------- */
async function renderFeed() {
  const box = $('#feed');
  box.innerHTML = '';

  // 发帖区
  const post = document.createElement('div');
  post.className = 'card';
  post.innerHTML = `<textarea id="feedInput" placeholder="分享你的故事…（消耗 3 💖，前 3 次免费）"

             border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:12px">

    const scope = bar.querySelector('#scScope').value;
    const url = `/api/scenario/list?q=${encodeURIComponent(q)}&category=${encodeURIComponent(cat)}&scope=${scope}`;
    const r = await api(url);
    [...box.querySelectorAll('.sc-item')].forEach(e => e.remove());
    const items = r.data || [];
    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'empty sc-item'; e.textContent = '没有符合条件的情景';
      box.appendChild(e); return;
    }
    for (const s of items) {
      const c = document.createElement('div');
      c.className = 'card sc-item';
      c.innerHTML = `<div class="meta">
          <b style="color:var(--gold);cursor:pointer" data-creator="${s.creator_id}">@${s.creator_name || 'creator'}</b>
          <span>📍 ${s.location || '—'}</span>
          <span class="pill pos">${s.category || '—'}</span>
          <span>播放 ${s.play_count}</span></div>
        <div class="body"><b>${s.title}</b>\n${s.description}</div>
        ${s.opener ? `<div class="intro" style="font-size:12px;color:var(--dim);
            margin-top:6px;font-style:italic">${s.opener}</div>` : ''}
        <div class="tags" style="margin-top:8px">${(s.tags||[]).map(t=>`<span>${t}</span>`).join('')}</div>
        <div class="acts">
          <span data-a="like" class="${s.liked ? 'on' : ''}">♥ ${s.like_count}</span>
          <span data-a="start">▶ 用这个情景开聊</span>
        </div>`;

        await api('/api/scenario/' + (s.liked ? 'unlike' : 'like'), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ scenarioId: s.id })});
        load();
      };
      const crel = c.querySelector('[data-creator]');
      if (crel) crel.onclick = () => openCreator(parseInt(crel.dataset.creator, 10));
      c.querySelector('[data-a=start]').onclick = async () => {
        if (!state.roles.length) return toast('先加载角色库');
        const rid = state.role ? state.role.id : state.roles[0].id;
        const rr = await api('/api/chatroom/listScenario', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ scenarioId: s.id, roleId: rid, chatMode: 'story' })});
        if (rr.flag !== 0) return toast(rr.msg);
        toast('已用《' + s.title + '》开启新会话');
        await refreshRooms();
        const room = state.rooms.find(x => x.id === rr.data.chatroomId);
        if (room) openRoom(room);
      };
      box.appendChild(c);
    }
  };

  bar.querySelector('#scQ').oninput = () => { clearTimeout(bar._t); bar._t = setTimeout(load, 300); };
  bar.querySelector('#scCat').onchange = load;
  bar.querySelector('#scScope').onchange = load;
  bar.querySelector('#scNew').onclick = async () => {
    const t = prompt('情景标题：');
    if (!t) return;
    const op = prompt('开场设定（开聊时先展示）：') || '';
    const r = await api('/api/scenario/create', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title: t, opener: op, description: op.slice(0, 60),
                             category: bar.querySelector('#scCat').value || 'romance' })});
    if (r.flag !== 0) return toast(r.msg);
    toast('情景已创建'); load();
  };

  load();
}

/* ---------- 语音播放 ---------- */
const speechCache = new Map();     // messageId → audio url
let currentAudio = null;

async function playSpeech(msgId, el) {
  // 同一时间只播一条
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const prev = document.querySelector('.msg .say.playing');
  if (prev) prev.classList.remove('playing');

  let url = speechCache.get(msgId);
  if (!url) {
    el.classList.add('loading');
    el.textContent = '合成中…';
    const r = await api('/api/message/speech/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messageId: msgId, chatroomId: state.chatroom.id })
    });
    el.classList.remove('loading');
    if (r.flag !== 0) {
      el.textContent = '🔇 失败';
      setTimeout(() => { el.textContent = '🔊 朗读'; }, 1800);
      return toast(r.msg.slice(0, 60));
    }
    url = API_BASE + r.data.url;
    speechCache.set(msgId, url);
  }

  const audio = new Audio(url);
  currentAudio = audio;
  el.classList.add('playing');
  el.textContent = '⏸ 播放中';
  const done = () => {
    el.classList.remove('playing');
    el.textContent = '🔊 朗读';
    if (currentAudio === audio) currentAudio = null;
  };
  audio.onended = done;
  audio.onerror = () => { done(); toast('音频播放失败'); };
  el.onclick = () => { audio.pause(); done(); };
  audio.play().catch(() => { done(); toast('浏览器拦截了自动播放，请再点一次'); });
}

/* ---------- 初始化 ---------- */
function switchTab(t) {
  state.tab = t;
  $('#tabRoles').classList.toggle('on', t === 'roles');
  $('#tabRooms').classList.toggle('on', t === 'rooms');
  $('#tabFeed').classList.toggle('on', t === 'feed');
  $('#tabScen').classList.toggle('on', t === 'scenario');
  $('#tabAlbum').classList.toggle('on', t === 'album');
  // 窄屏下角色/会话列表也放主区（侧栏在抽屉里，不点 ☰ 看不到）
  const listInMain = isNarrow() && (t === 'roles' || t === 'rooms');
  const inOverlay = (t === 'feed' || t === 'scenario' || t === 'album' || listInMain);
  const inChapters = (t === 'chapters');
  $('#chat').style.display = (inOverlay) ? 'none' : 'flex';
  $('#composer').style.display = (inOverlay || inChapters) ? 'none' : 'block';
  $('#chatTools').style.display = inOverlay ? 'none' : 'flex';
  $('#feed').style.display = inOverlay ? 'flex' : 'none';
  // 窄屏下选完 tab 就该收起抽屉，否则用户看不到内容
  if (typeof navOpen === 'function') navOpen(false);
  if (t === 'feed') {
    $('#who').textContent = '动态'; $('#sub').textContent = '创作者的动态';
    setHero(null); renderFeed();
  }
  else if (t === 'scenario') {
    $('#who').textContent = '情景'; $('#sub').textContent = '选一个情景开聊';
    setHero(null); renderScenarios();
  }
  else if (t === 'album') {
    $('#who').textContent = '相册'; $('#sub').textContent = 'AI 生成的角色图像';
    setHero(null); renderAlbum();
  }
  else if (inChapters) {
    $('#who').textContent = (state.role ? state.role.name : '') + ' · 隐藏章节';
    $('#sub').textContent = '好感度驱动解锁';
    setHero(state.role ? state.role.name : null); renderChapters();
  }
  else if (listInMain) {
    $('#who').textContent = (t === 'roles') ? '角色' : '会话';
    $('#sub').textContent = (t === 'roles') ? '选一个开始对话' : '继续你的故事';
    setHero(null);
    renderList();          // 侧栏（抽屉里）也保持一致
    renderMainList();      // 主区展示
  }
  else { setHero(null); renderList(); }
}
async function refreshRooms() {
  const r = await api('/api/chatroom/list');
  state.rooms = r.flag === 0 ? r.data : [];
}
$('#tabRoles').onclick = () => switchTab('roles');
$('#tabRooms').onclick = () => switchTab('rooms');
$('#tabFeed').onclick = () => switchTab('feed');
$('#tabScen').onclick = () => switchTab('scenario');
$('#tabAlbum').onclick = () => switchTab('album');

/* ---- 移动端抽屉导航（窄屏才可见的 ☰）---- */
function navOpen(v){ document.body.classList.toggle('nav-open', !!v); }
$('#btnMenu').onclick = () => navOpen(!document.body.classList.contains('nav-open'));
$('#scrim').onclick = () => navOpen(false);

/* ---- 触屏设备：键盘快捷键提示无意义，换成简洁文案 ----
   桌面（有 hover 能力）保留 Enter / Shift+Enter 说明。 */
if (window.matchMedia && window.matchMedia('(hover: none)').matches) {
  $('#input').placeholder = '说点什么…';
  // 触屏没有「左侧栏」这个概念，引导语要指向 ☰ 按钮
  const _empty = document.querySelector('#chat .empty');
  if (_empty) _empty.textContent = '点击左上角 ☰ 选择角色';
}
/* 宽窄切换时重排列表：从窄屏转宽屏要把角色列表从主区撤回侧栏，
   反之亦然。只在断点跨越时动作，避免无谓重绘。 */
let _wasNarrow = isNarrow();
window.addEventListener('resize', () => {
  const now = isNarrow();
  if (now === _wasNarrow) return;
  _wasNarrow = now;
  if (state.tab === 'roles' || state.tab === 'rooms') switchTab(state.tab);
});

$('#send').onclick = send;
$('#modeSel').onchange = updateCost;
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

/* ---------- 认证界面 ---------- */
let authMode = 'login';                       // 'login' | 'register'

function authErrorText(msg) {
  return ({
    INVALID_EMAIL: 'That email address does not look right.',
    WEAK_PASSWORD: 'Password must be at least 8 characters.',
    EMAIL_TAKEN: 'That email is already registered — try signing in.',
    INVALID_CREDENTIALS: 'Email or password is incorrect.',
    UNAUTHORIZED: 'Your session expired. Please sign in again.',
    RATE_LIMITED: 'Too many attempts. Please wait a minute and retry.'
  })[msg] || ('Something went wrong: ' + msg);
}

function showAuthGate(msg, ok) {
  $('#authGate').style.display = 'flex';
  const el = $('#authMsg');
  el.textContent = msg || '';
  el.className = 'authmsg' + (ok ? ' ok' : '');
  $('#authSubmit').disabled = false;
  $('#authSubmit').textContent = authMode === 'login' ? 'Sign in' : 'Create account';
  $('#authSwitch').textContent = authMode === 'login'
    ? 'Create a new account' : 'I already have an account';
}

function hideAuthGate() { $('#authGate').style.display = 'none'; }

/* ---------- 账号操作 ---------- */

function renderAccount() {
  const u = state.user || {};
  $('#userName').textContent = u.nickname || (u.id ? 'User #' + u.id : '—');
}

/* 改密码。表单就地展开，不用原生 prompt() —— WebView 不实现它。
   改完服务端会吊销全部令牌（把可能存在的其他会话踢下线），
   因此这里也要清掉本地令牌并回到登录页。 */
$('#btnChangePw').onclick = () => {
  const f = $('#pwForm');
  const opening = f.style.display === 'none';
  f.style.display = opening ? 'flex' : 'none';
  if (opening) $('#pwCurrent').focus();
};

$('#pwCancel').onclick = () => {
  $('#pwForm').style.display = 'none';
  $('#pwCurrent').value = '';
  $('#pwNew').value = '';
};

$('#pwSubmit').onclick = async () => {
  const btn = $('#pwSubmit');
  const cur = $('#pwCurrent').value;
  const nw = $('#pwNew').value;
  if (!cur || !nw) { toast('Fill in both password fields'); return; }
  if (nw.length < 8) { toast('New password must be at least 8 characters'); return; }

  btn.disabled = true;
  btn.textContent = 'Updating…';
  try {
    const r = await api('/api/auth/password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ currentPassword: cur, newPassword: nw })
    });
    if (r.flag !== 0) {
      const map = {
        INVALID_CREDENTIALS: 'Current password is incorrect.',
        WEAK_PASSWORD: 'New password must be at least 8 characters.',
        UNAUTHORIZED: 'Session expired — please sign in again.'
      };
      throw new Error(map[r.msg] || r.msg);
    }
    toast('Password updated — signing you out');
    AUTH_TOKEN.clear();
    setTimeout(() => location.reload(), 1400);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Update';
    toast('Could not update: ' + e.message);
  }
};

$('#btnSignOut').onclick = async () => {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) { /* 网络失败也照样本地登出 */ }
  AUTH_TOKEN.clear();
  delete state.user;
  location.reload();
};

/* 删除账号用「两次点击」而非 confirm() —— WebView 默认不实现
   onJsConfirm/onJsPrompt，原生对话框不会弹出来，点了没反应。 */
let deleteArmed = false;
let deleteTimer = null;

$('#btnDeleteAccount').onclick = async () => {
  const btn = $('#btnDeleteAccount');
  if (!deleteArmed) {
    deleteArmed = true;
    btn.classList.add('armed');
    btn.textContent = 'Tap again to confirm';
    deleteTimer = setTimeout(() => {
      deleteArmed = false;
      btn.classList.remove('armed');
      btn.textContent = 'Delete account';
    }, 6000);
    return;
  }
  clearTimeout(deleteTimer);
  deleteArmed = false;
  btn.disabled = true;
  btn.textContent = 'Deleting…';
  try {
    const r = await api('/api/auth/delete', { method: 'POST' });
    if (r.flag !== 0) throw new Error(r.msg || 'failed');
    AUTH_TOKEN.clear();
    delete state.user;
    location.reload();
  } catch (e) {
    btn.disabled = false;
    btn.classList.remove('armed');
    btn.textContent = 'Delete account';
    toast('Could not delete account: ' + e.message);
  }
};

async function submitAuth() {
  const email = $('#authEmail').value.trim();
  const password = $('#authPass').value;
  if (!email || !password) { showAuthGate('Please fill in both fields.'); return; }

  $('#authSubmit').disabled = true;
  try {
    const r = await api(authMode === 'login' ? '/api/auth/login' : '/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email, password })
    });
    if (r.flag !== 0) { showAuthGate(authErrorText(r.msg)); return; }
    AUTH_TOKEN.set(r.data.token);
    state.user = r.data.user;
    $('#authPass').value = '';
    hideAuthGate();
    await loadAppData();
  } catch (e) {
    showAuthGate('Cannot reach the server. Check your connection.');
  } finally {
    $('#authSubmit').disabled = false;
  }
}

$('#authSubmit').onclick = submitAuth;
$('#authSwitch').onclick = () => {
  authMode = authMode === 'login' ? 'register' : 'login';
  showAuthGate('');
};
$('#authPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submitAuth(); }
});
$('#authEmail').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('#authPass').focus(); }
});

/** 有有效令牌就直接进；否则显示登录界面并等用户操作。 */
async function ensureAuth() {
  if (!AUTH_TOKEN.get()) { showAuthGate(''); return false; }
  try {
    const r = await api('/api/auth/me');
    if (r.flag === 0) { state.user = r.data; return true; }
  } catch (e) { /* 网络异常也回落到登录界面 */ }
  AUTH_TOKEN.clear();
  showAuthGate('Your session expired. Please sign in again.');
  return false;
}

/** 登录后的数据装载。 */
async function loadAppData() {
  // 用 allSettled 而非 all：两个请求谁先回来就先渲染谁。
  // 实测 chatMode 偶发要 6 秒以上，用 Promise.all 会让已经返回的
  // role/list 一起干等 —— 界面白屏，用户体感就是「卡住」。
  const [rolesRes, modesRes] = await Promise.allSettled([
    api('/api/role/list'), api('/api/chatMode')
  ]);
  state.roles = (rolesRes.status === 'fulfilled' && rolesRes.value.flag === 0)
    ? (rolesRes.value.data || []) : [];
  state.modes = (modesRes.status === 'fulfilled' && modesRes.value.flag === 0)
    ? (modesRes.value.data || []) : [];
  if (state.modes.length) {
    $('#modeSel').innerHTML = state.modes.map(m =>
      `<option value="${m.id}">${m.id} · ${m.heartCost}💖</option>`).join('');
    $('#modeSel').value = 'classic';
  }
  // modes 拿不到时保留 select 的默认内容，不阻断角色列表渲染
  updateCost();
  await refreshRooms();
  // 走 switchTab 而不是直接 renderList()：窄屏下「列表放主区」的
  // 分支在 switchTab 里，绕过它会导致首屏仍是空聊天区。
  switchTab('roles');
  refreshWallet();
  refreshAd();
  renderAccount();
}

(async function init() {
  if (API_BASE) $('#apiHint').textContent = 'API: ' + API_BASE;
  try {
    if (!await ensureAuth()) return;         // 用户登录后由 submitAuth 继续
    await loadAppData();
  } catch (e) {
    showBootError(e);
  }
})();

/* 启动失败：给出可操作的界面，而不是一片空白。
   手机换网络后服务地址就变了，这里让用户能直接改，不必重装 APK。 */
function showBootError(err) {
  const addr = API_BASE || location.origin;
  const canNative = !!(window.VesperineNative && window.VesperineNative.openServerSettings);
  const box = document.getElementById('chat');
  if (!box) return;
  box.innerHTML =
    '<div class="empty" style="max-width:330px;line-height:1.95">'
    + '<div style="font-size:15px;color:var(--ink);margin-bottom:12px">连不上服务器</div>'
    + '<div style="font-size:12.5px;color:var(--dim);margin-bottom:6px">当前地址</div>'
    + '<code style="display:block;font-size:11.5px;color:var(--gold);word-break:break-all;'
    + 'margin-bottom:16px">' + addr + '</code>'
    + '<div style="font-size:12.5px;color:var(--dim);margin-bottom:18px">'
    + '请确认手机与电脑在同一网络。<br>如果刚换过网络，服务器地址需要更新。'
    + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
    + (canNative
        ? '<button class="ghost" id="bootFix" style="padding:8px 16px">修改服务器地址</button>'
        : '')
    + '<button class="ghost" id="bootRetry" style="padding:8px 16px">重试</button>'
    + '</div>'
    + '<div id="bootErr" style="font-size:11px;color:#6f6885;margin-top:16px"></div>'
    + '</div>';
  const errEl = document.getElementById('bootErr');
  if (errEl) errEl.textContent = String((err && err.message) || err || '');
  const fix = document.getElementById('bootFix');
  if (fix) fix.onclick = () => window.VesperineNative.openServerSettings();
  const retry = document.getElementById('bootRetry');
  if (retry) retry.onclick = () => location.reload();
}
</script>
