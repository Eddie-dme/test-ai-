plugins {
    id 'com.android.application'
}

android {
    namespace 'top.lurvy.vesperine'
    compileSdk 36

    defaultConfig {
        applicationId "top.lurvy.vesperine"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        // 生产地址。注意：实际构建走 build_apk.sh / build_aab.sh，它们编译的是
        // 手写的 BuildConfig.java（含 ACCESS_KEY，不进版本控制）。
        // ⚠️ 若启用 Gradle 构建，会与那份手写类生成同名类而冲突，需二选一：
        //    排除源码里的 BuildConfig.java，或关掉 buildFeatures.buildConfig。
        buildConfigField "String", "SERVER_URL", "\"https://api.lurvy.top\""
    }

    buildTypes {
        debug {
            // 测试包：不做混淆，方便看日志
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            // 未配签名时会生成未签名包，仅用于内部测试
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 无第三方依赖：只用 Android 系统自带的 WebView
}
